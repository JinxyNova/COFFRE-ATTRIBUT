name: Build GiveFx

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compiler
        run: mvn -B -ntp clean package

      - name: Envoyer le jar (onglet Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: GiveFx
          path: target/GiveFx.jar
          if-no-files-found: error

      - name: Publier une release (si tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/GiveFx.jar
