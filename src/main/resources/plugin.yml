name: GiveFx
version: 1.3.0
main: fr.merci.givefx.GiveFx
api-version: '1.21'
description: Effets spéciaux pour les objets créés avec le générateur de /give
commands:
  givefx:
    description: Menu de réglages, coffre quotidien, butin, enchantements sans limite
    usage: /givefx <menu|chest|loot|enchant|reload>
    permission: givefx.admin
permissions:
  givefx.admin:
    description: Recharger GiveFx
    default: op
