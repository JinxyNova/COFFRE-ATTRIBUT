  #     Ils sont testés avant les normaux, indépendamment les uns des autres.
  #   Autres clés :
  #   item    : matière de base (ex. STICK, APPLE)
  #   min/max : quantité tirée au hasard
  #   name    : nom affiché (codes couleur avec &, ex. &6)
  #   lore    : lignes de description
  #   fx      : effets, écrits comme dans le générateur (t = quand, a = action, p = réglages,
