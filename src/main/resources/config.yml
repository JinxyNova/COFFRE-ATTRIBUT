# ╔══════════════════════════════════════════════════════════════╗
# ║                      GiveFx  ·  v1.3                         ║
# ║        Effets spéciaux pour les objets du générateur         ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Après une modification : /givefx reload  (permission givefx.admin)
# Astuce : l'éditeur web (givefx-config-editeur.html) génère ce fichier pour toi.


# ┌──────────────────────────────────────────────────────────────┐
# │  1. SÉCURITÉ                                                 │
# └──────────────────────────────────────────────────────────────┘

# Autoriser l'action « Commande » des objets.
# Laisse "false" si des joueurs ont le mode créatif : ils pourraient
# fabriquer un objet qui lance des commandes en console.
allow-commands: false


# ┌──────────────────────────────────────────────────────────────┐
# │  2. LIMITES                                                  │
# └──────────────────────────────────────────────────────────────┘

# Puissance maximale d'une explosion (4 = une TNT)
max-explosion-power: 20

# Rayon maximal de l'action « Casser autour » (1 = zone 3×3×3)
max-radius: 5


# ┌──────────────────────────────────────────────────────────────┐
# │  3. COFFRE QUOTIDIEN                                         │
# │  Un coffre rempli d'objets aléatoires chaque jour,           │
# │  près de chaque joueur connecté.                             │
# └──────────────────────────────────────────────────────────────┘
#
# Un seul coffre par jour et par joueur (mémorisé dans daily.txt).
# Si personne n'est connecté à l'heure prévue, il attend la prochaine connexion.
#
# Réglages :
#   enabled      true / false
#   time         heure du serveur, format "HH:mm"
#   block        bloc posé (CHEST par défaut)
#   items-min    nombre minimum d'emplacements remplis
#   items-max    nombre maximum d'emplacements remplis
#   drop-chance  chance (en %) de trouver un objet NORMAL en cassant un bloc
#
# Objets de la liste :
#   • NORMAL : pas de "chance", tiré selon "weight" (plus grand = plus fréquent)
#   • RARE   : "chance" en % à chaque tirage (0.001 = 1 sur 100 000)
#   Autres clés : item, min, max, name (&couleurs), lore (lignes), fx (effets)
daily-event:
  enabled: false
  time: "08:00"            # heure du serveur, format HH:mm
  block: CHEST             # bloc posé (un coffre par défaut, il contient les objets)
  items-min: 3             # nombre minimum d'emplacements remplis
  items-max: 6             # nombre maximum d'emplacements remplis
  # Petite chance, en cassant un bloc en survie, de trouver un objet normal de cette liste.
  drop-chance: 2           # en %

  # Lucky Blocks ajoutés dans CHAQUE coffre quotidien (le plugin LuckyBlock doit être installé).
  #   chance : chance (en %) que le coffre contienne des Lucky Blocks (100 = toujours)
  #   min/max : nombre de Lucky Blocks, tiré au hasard (64 maximum)
  lucky-blocks:
    enabled: true
    chance: 100
    min: 2
    max: 10

  # Événement à l'OUVERTURE du coffre quotidien (une seule fois par coffre).
  #   chance : chance (en %) qu'un événement se déclenche quand on ouvre le coffre
  #   events : liste des événements possibles, avec leur poids (weight)
  #     TNT        : 6 TNT qui explosent autour du coffre
  #     ORE_RAIN   : pluie de minerais (25 tas, dont des débris de netherite, rarement)
  #     MIMIC      : un zombie « Faux coffre » apparaît
  #     CHICKENS   : 8 poulets autour du coffre
  #     XP         : pluie d'orbes d'expérience
  #     LIGHTNING  : coup de foudre (visuel uniquement, sans dégâts)
  #     BOOM       : une explosion (sans casser de blocs)
  #     RARE       : un objet rare tombe du ciel
  #     PARTY      : feu d'artifice de particules
  #     NOTHING    : rien (on dit juste que le coffre est vide)
  #     COWS       : 5 vaches
  #     PIGS       : 5 cochons
  #     SHEEP      : 5 moutons
  #     JOKE       : une blague au hasard, envoyée au joueur
  #     CAKE       : 3 gâteaux qui tombent
  open-events:
    chance: 100
    events:
      - { event: TNT, weight: 3 }
      - { event: ORE_RAIN, weight: 4 }
      - { event: MIMIC, weight: 2 }
      - { event: CHICKENS, weight: 2 }
      - { event: XP, weight: 3 }
      - { event: LIGHTNING, weight: 2 }
      - { event: BOOM, weight: 2 }
      - { event: RARE, weight: 1 }
      - { event: PARTY, weight: 2 }
      - { event: NOTHING, weight: 2 }
      - { event: COWS, weight: 2 }
      - { event: PIGS, weight: 2 }
      - { event: SHEEP, weight: 2 }
      - { event: JOKE, weight: 3 }
      - { event: CAKE, weight: 1 }

  # Liste des objets possibles. Deux sortes :
  #   - objets NORMAUX : pas de "chance". Tirés selon "weight" (plus grand = plus fréquent).
